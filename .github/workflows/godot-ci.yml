name: "godot-ci export"
on: push

# NOTE: If your `project.godot` is at the repository root, set `PROJECT_PATH` below to ".".

env:
  GODOT_VERSION: 4.7.2
  EXPORT_NAME: shader-demos
  PROJECT_PATH: .

# 同一分支上排队执行，避免并发部署互相覆盖
concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

